[package]
name = "bevy_spatial_egui"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.16", default-features = false }
bevy_egui = { version = "0.34"}
bevy-suis = {git = "https://github.com/MiniMinerX/bevy-suis.git", branch = "dev-0.16"}
wgpu-types = { version = "24.0"}

[dev-dependencies]
bevy_panorbit_camera = "0.26"
bevy_mod_xr = { git = "https://github.com/awtterpip/bevy_oxr.git"}
bevy_mod_openxr = { git = "https://github.com/awtterpip/bevy_oxr.git"}
bevy_xr_utils = { git = "https://github.com/awtterpip/bevy_oxr.git"}

[lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
